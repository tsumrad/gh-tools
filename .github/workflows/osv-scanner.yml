name: OSV Scanner (Reusable)

on:
  workflow_call:
    inputs:
      scan-args:
        description: Arguments passed to OSV scanner
        required: false
        type: string
        default: "-r --skip-git --format=sarif --output=osv-scanner-results.sarif ./"

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2
    with:
      scan-args: ${{ inputs.scan-args }}
