name: OSV Scanner (Reusable)

on:
  workflow_call:
    inputs:
      scan-args:
        description: Arguments passed to OSV scanner
        required: false
        type: string
        default: "-r --skip-git --format=sarif --output=osv-scanner-results.sarif ./"

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@1f1242919d8a60496dd1874b24b62b2370ed4c78
    with:
      scan-args: ${{ inputs.scan-args }}
