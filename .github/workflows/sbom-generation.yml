name: SBOM Generation Reusable

on:
  # Reusable entrypoint for repository workflows.
  workflow_call:
    inputs:
      # Scan target selection.
      source_path: &source_path_input
        description: Path to scan for filesystem SBOM generation
        required: false
        default: .
        type: string
      enable_filesystem_scan: &enable_filesystem_scan_input
        description: Generate CycloneDX SBOMs from detected ecosystem directories
        required: false
        default: true
        type: boolean

      # Tooling.
      syft_version: &syft_version_input
        description: Pinned Syft version for deterministic behavior
        required: false
        default: v1.45.0
        type: string

      # Artifact publishing.
      upload_artifacts: &upload_artifacts_input
        description: Upload generated SBOMs as workflow artifacts
        required: false
        default: true
        type: boolean
      artifact_prefix: &artifact_prefix_input
        description: Artifact prefix
        required: false
        default: sbom
        type: string
      artifact_retention_days: &artifact_retention_days_input
        description: Artifact retention period in days
        required: false
        default: 30
        type: number

  # Optional manual trigger for testing this shared workflow directly.
  workflow_dispatch:
    inputs:
      source_path: *source_path_input
      enable_filesystem_scan: *enable_filesystem_scan_input
      syft_version: *syft_version_input
      upload_artifacts: *upload_artifacts_input
      artifact_prefix: *artifact_prefix_input
      artifact_retention_days: *artifact_retention_days_input

permissions:
  # Minimum required for checkout and source scanning.
  contents: write
  # Required to upload Trivy SARIF results to code scanning.
  security-events: write
  # Required to raise or update the grouped findings PR.
  pull-requests: write

jobs:
  prepare-matrix:
    name: Prepare SBOM Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      matrix_count: ${{ steps.matrix.outputs.matrix_count }}
      syft_version: ${{ steps.cfg.outputs.syft_version }}
      upload_artifacts: ${{ steps.cfg.outputs.upload_artifacts }}
      artifact_prefix: ${{ steps.cfg.outputs.artifact_prefix }}
      artifact_retention_days: ${{ steps.cfg.outputs.artifact_retention_days }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve inputs once
        id: cfg
        shell: bash
        run: |
          set -euo pipefail
          echo "source_path=${{ inputs.source_path }}" >> "$GITHUB_OUTPUT"
          echo "enable_filesystem_scan=${{ inputs.enable_filesystem_scan }}" >> "$GITHUB_OUTPUT"
          echo "syft_version=${{ inputs.syft_version }}" >> "$GITHUB_OUTPUT"
          echo "upload_artifacts=${{ inputs.upload_artifacts }}" >> "$GITHUB_OUTPUT"
          echo "artifact_prefix=${{ inputs.artifact_prefix }}" >> "$GITHUB_OUTPUT"
          echo "artifact_retention_days=${{ inputs.artifact_retention_days }}" >> "$GITHUB_OUTPUT"

      - name: Validate inputs only
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ steps.cfg.outputs.enable_filesystem_scan }}" != "true" ]; then
            echo "enable_filesystem_scan must be true." >&2
            exit 1
          fi

      - name: Build scan matrix
        id: matrix
        uses: tsumrad/gh-tools/.github/actions/build-ecosystem-matrix@main
        with:
          mode: sbom
          path: ${{ steps.cfg.outputs.source_path }}

      - name: Summarize scan matrix
        shell: bash
        env:
          DETECTED: ${{ steps.matrix.outputs.detected }}
          TARGETS: ${{ steps.matrix.outputs.targets }}
        run: |
          set -euo pipefail
          echo "### Scan Matrix" >> "$GITHUB_STEP_SUMMARY"
          echo "Entries: ${{ steps.matrix.outputs.matrix_count }}" >> "$GITHUB_STEP_SUMMARY"
          detected_summary="$(jq -r 'join(", ")' <<< "$DETECTED")"
          targets_summary="$(jq -r 'join(", ")' <<< "$TARGETS")"
          echo "Detected ecosystems: $detected_summary" >> "$GITHUB_STEP_SUMMARY"
          echo "Selected targets: $targets_summary" >> "$GITHUB_STEP_SUMMARY"

  generate-sbom:
    name: Generate SBOM (${{ matrix.scan_label }})
    runs-on: ubuntu-latest
    needs: prepare-matrix
    if: needs.prepare-matrix.outputs.matrix_count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run SBOM core action
        uses: tsumrad/gh-tools/.github/actions/sbom@main
        with:
          source: ${{ matrix.source }}
          output_prefix: ${{ matrix.output_prefix }}
          syft_version: ${{ needs.prepare-matrix.outputs.syft_version }}
          scan_label: ${{ matrix.scan_label }}

      - name: Verify SBOM output
        shell: bash
        run: |
          set -euo pipefail
          ls -lah
          test -f "${{ matrix.output_prefix }}.cyclonedx.json"
          test -f "${{ matrix.output_prefix }}.spdx.json"

      - name: Force refresh GitHub Dependency Graph
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          SNAPSHOT_FILE="${{ matrix.output_prefix }}.github.json"
          NORMALIZED_SNAPSHOT_FILE="${{ matrix.output_prefix }}.github.normalized.json"

          if [ ! -f "$SNAPSHOT_FILE" ]; then
            syft "${{ matrix.source }}" --output "github-json=$SNAPSHOT_FILE"
          fi

          jq \
            --arg ref "$GITHUB_REF" \
            --arg sha "$GITHUB_SHA" \
            --arg scanned "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            --arg job_id "$GITHUB_JOB" \
            --arg correlator "sbom-${{ matrix.scan_label }}" \
            '.ref = $ref | .sha = $sha | .scanned = (.scanned // $scanned) | .job.id = $job_id | .job.correlator = $correlator' \
            "$SNAPSHOT_FILE" > "$NORMALIZED_SNAPSHOT_FILE"

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/dependency-graph/snapshots" \
            --input "$NORMALIZED_SNAPSHOT_FILE"

      - name: Scan SBOM for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: sbom
          scan-ref: ${{ matrix.output_prefix }}.cyclonedx.json
          format: sarif
          output: ${{ matrix.output_prefix }}.sarif
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: 0

      - name: Verify SARIF output
        shell: bash
        run: |
          set -euo pipefail

          SARIF_FILE="${{ matrix.output_prefix }}.sarif"

          if [ ! -f "$SARIF_FILE" ]; then
            echo "SARIF output was not generated: $SARIF_FILE"
            exit 1
          fi

          echo "Generated SARIF:"
          ls -lh "$SARIF_FILE"

      - name: Upload vulnerability SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ matrix.output_prefix }}.sarif
          category: trivy-${{ matrix.scan_label }}

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@v7
        with:
          name: trivy-results-${{ matrix.scan_label }}
          path: ${{ matrix.output_prefix }}.sarif
          if-no-files-found: error
          retention-days: ${{ needs.prepare-matrix.outputs.artifact_retention_days }}

      - name: Upload SBOM artifacts
        if: needs.prepare-matrix.outputs.upload_artifacts == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.prepare-matrix.outputs.artifact_prefix }}-${{ github.run_id }}-${{ matrix.scan_label }}
          path: ${{ matrix.output_prefix }}.cyclonedx.json
          if-no-files-found: error
          retention-days: ${{ needs.prepare-matrix.outputs.artifact_retention_days }}

  group-findings-pr:
    name: Group findings and raise PR
    runs-on: ubuntu-latest
    needs:
      - prepare-matrix
      - generate-sbom
    if: needs.prepare-matrix.outputs.matrix_count != '0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Group SBOM code scanning findings
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          REPORT_FILE="security/trivy-findings.md"
          ALERTS_FILE="$(mktemp)"
          mkdir -p "$(dirname "$REPORT_FILE")"

          gh api \
            --paginate \
            "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&per_page=100" \
            > "$ALERTS_FILE"

          {
            echo "# Trivy SBOM Findings"
            echo
            echo "Generated from open GitHub Code Scanning findings uploaded by SBOM vulnerability scans."
            echo
          } > "$REPORT_FILE"

          jq -r '
            def normalize_severity:
              ascii_upcase
              | if . == "ERROR" then "HIGH"
                elif . == "WARNING" then "MEDIUM"
                elif . == "NOTE" then "LOW"
                elif . == "NONE" then "UNKNOWN"
                else .
                end;

            [
              .[]
              | select((.tool.name // "" | ascii_downcase) | contains("trivy"))
              | select((.most_recent_instance.category // "") | startswith("trivy-"))
              | {
                  ruleId: (.rule.id // "unknown"),
                  severity: ((.rule.security_severity_level // .rule.severity // "unknown") | normalize_severity),
                  category: (.most_recent_instance.category // "unknown"),
                  location: (
                    ((.most_recent_instance.location.path // "unknown")
                    + ":"
                    + ((.most_recent_instance.location.start_line // 1) | tostring))
                  ),
                  message: (.rule.description // .rule.name // "No details provided."),
                  url: (.html_url // "")
                }
            ]
            | group_by(.severity)
            | sort_by(
                (.[0].severity | {
                  "CRITICAL": 0,
                  "HIGH": 1,
                  "MEDIUM": 2,
                  "LOW": 3,
                  "UNKNOWN": 4
                }[.] // 5)
              )
            | if length == 0 then
                "No vulnerability findings were reported."
              else
                map(
                  "## " + .[0].severity + " (" + (length | tostring) + ")\n\n"
                  + (
                    group_by(.ruleId)
                    | sort_by(.[0].ruleId)
                    | map(
                        "### " + .[0].ruleId + " (" + (length | tostring) + ")\n\n"
                        + (
                          map("- `" + .category + "` `" + .location + "` - " + (.message | gsub("\n"; " ")) + (if .url != "" then " ([alert](" + .url + "))" else "" end))
                          | unique
                          | join("\n")
                        )
                      )
                    | join("\n\n")
                  )
                )
                | join("\n\n")
              end
          ' "$ALERTS_FILE" >> "$REPORT_FILE"

      - name: Raise grouped findings PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: automation/grouped-trivy-findings
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain -- security/trivy-findings.md)" ]; then
            echo "No grouped findings changes to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$PR_BRANCH"
          git add security/trivy-findings.md
          git commit -m "Group Trivy SBOM findings"
          git push --force-with-lease origin "$PR_BRANCH"

          pr_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${GITHUB_REF_NAME}...${PR_BRANCH}?quick_pull=1"
          existing_pr="$(gh pr list --head "$PR_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing_pr" ]; then
            gh pr edit "$existing_pr" \
              --title "Group Trivy SBOM findings" \
              --body "Updates the grouped Trivy SBOM findings report from workflow run ${GITHUB_RUN_ID}." ||
              echo "Unable to update PR. Open manually: $pr_url"
          else
            if ! gh pr create \
              --base "${GITHUB_REF_NAME}" \
              --head "$PR_BRANCH" \
              --title "Group Trivy SBOM findings" \
              --body "Adds or updates the grouped Trivy SBOM findings report from workflow run ${GITHUB_RUN_ID}."; then
              {
                echo "### Grouped findings PR"
                echo
                echo "The grouped findings branch was pushed, but GitHub Actions is not permitted to create pull requests in this repository."
                echo
                echo "Open the PR manually: $pr_url"
              } >> "$GITHUB_STEP_SUMMARY"
              echo "GitHub Actions is not permitted to create pull requests. Open manually: $pr_url"
            fi
          fi
